<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo JS</title>
    <link rel="stylesheet" href="bonifaccio_esercizio_js_08.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <h1>TODO JS</h1>
    <div class="input-container">
        <input type="text" id="casellaTesto" placeholder="my todo item">
        <select id="tendinaPriorita">
            <option value="Bassa">Bassa</option>
            <option value="Media">Media</option>
            <option value="Alta">Alta</option>
        </select>
        <button id="bottoneAggiungi" title="Aggiungi">
            <i class="fa-solid fa-plus"></i>
        </button>
    </div>
    <hr>
    <ul id="listaHtml"></ul>
    <script src="bonifaccio_esercizio_js_08.js"></script>
</body>
</html>
